global(
  DefaultNetstreamDriverCAFile="/certs/ca.pem"
  DefaultNetstreamDriverCertFile="/certs/server.pem"
  DefaultNetstreamDriverKeyFile="/certs/server.key"
  maxMessageSize="64k"
)
module(load="imudp")
module(load="imtcp" maxSessions="100")
module(load="mmpstrucdata")
module(load="impstats" interval="30" format="json" log.file="/out/impstats.json")

# Plain UDP and TCP (comparison), RFC 5425 TLS on 6514 (octet-counted framing is detected).
input(type="imudp" port="10514" ruleset="afs")
input(type="imtcp" port="10514" ruleset="afs")
input(type="imtcp" port="6514" ruleset="afs" name="tls"
      streamDriver.name="ossl" streamDriver.mode="1" streamDriver.authMode="anon")

template(name="raw" type="string" string="%rawmsg%\n")
template(name="parsed" type="list") {
  constant(value="{\"input\":\"") property(name="inputname")
  constant(value="\",\"host\":\"") property(name="hostname" format="json")
  constant(value="\",\"app\":\"") property(name="app-name" format="json")
  constant(value="\",\"procid\":\"") property(name="procid" format="json")
  constant(value="\",\"msgid\":\"") property(name="msgid" format="json")
  constant(value="\",\"severity\":\"") property(name="syslogseverity-text")
  constant(value="\",\"ts\":\"") property(name="timereported" dateFormat="rfc3339")
  constant(value="\",\"msg\":\"") property(name="msg" format="json" droplastlf="on")
  constant(value="\",\"sd\":") property(name="$!rfc5424-sd")
  constant(value="}\n")
}
ruleset(name="afs") {
  action(type="mmpstrucdata")
  action(type="omfile" file="/out/raw.log" template="raw")
  action(type="omfile" file="/out/parsed.jsonl" template="parsed")
}
