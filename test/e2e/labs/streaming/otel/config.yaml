receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
exporters:
  otlp/jaeger:
    endpoint: spike-s10-jaeger:4317
    tls: { insecure: true }
  file/logs:
    path: /out/logs.jsonl
  file/traces:
    path: /out/traces.jsonl
service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [otlp/jaeger, file/traces] }
    logs: { receivers: [otlp], processors: [batch], exporters: [file/logs] }
