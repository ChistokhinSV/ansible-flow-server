# Secret provider lab (AFS-235, AFS-282): HashiCorp Vault, CyberArk Conjur OSS, LocalStack (AWS
# Secrets Manager) and a CyberArk CCP mock. Fictional secrets only. Started by up.sh, which sets
# LAB_HOST (the address the ports are published on) and CONJUR_DATA_KEY.
name: spike-s9
networks:
  spike-s9:
    name: spike-s9
services:
  vault:
    image: hashicorp/vault:2.2.2
    container_name: spike-s9-vault
    # Dev mode with TLS: Vault makes its own CA (written to /vault/tls/vault-ca.pem).
    command: >
      server -dev -dev-tls -dev-tls-cert-dir=/vault/tls
      -dev-root-token-id=spike-s9-root -dev-listen-address=0.0.0.0:8200
      -dev-tls-san=${LAB_HOST} -dev-tls-san=spike-s9-vault
    cap_add: [IPC_LOCK]
    volumes: [./out/vault-tls:/vault/tls]
    ports: ["${LAB_HOST}:18200:8200"]
    networks: [spike-s9]
  conjur-db:
    image: postgres:18.7-alpine
    container_name: spike-s9-conjur-db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks: [spike-s9]
  conjur:
    image: cyberark/conjur:1.27.0
    container_name: spike-s9-conjur
    command: server
    environment:
      DATABASE_URL: postgres://postgres@spike-s9-conjur-db/postgres
      # Made by up.sh (openssl rand -base64 32), kept in out/.
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY}
      CONJUR_AUTHENTICATORS: authn
    depends_on: [conjur-db]
    ports: ["${LAB_HOST}:18080:80"]
    networks: [spike-s9]
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0}
    container_name: spike-s9-localstack
    environment:
      SERVICES: secretsmanager
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports: ["${LAB_HOST}:14566:4566"]
    networks: [spike-s9]
  ccp-mock:
    image: node:24-bookworm
    container_name: spike-s9-ccp
    command: node /mock/ccp-mock.mjs
    working_dir: /mock
    environment:
      CCP_PORT: "443"
    # up.sh puts the mock and its certificates (made there, never committed) in out/ccp.
    volumes: [./out/ccp:/mock:ro]
    ports: ["${LAB_HOST}:18443:443"]
    networks: [spike-s9]
