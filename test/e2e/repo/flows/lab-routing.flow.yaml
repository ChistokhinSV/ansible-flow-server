  - id: 01M7GVB235SEP5380TRJYD6EYM
    from:
      node: 01M7GVB231ZDH0RNHJJKT7G1XY
      port: ok_hosts
    to:
      node: 01M7GVAT9DX38F8RMVAS16R7K4
