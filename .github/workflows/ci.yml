# Checks every push to main and every pull request: the type check, Biome and the unit tests, as
# `just check` and `just test` run them.
#
# The designer's packages (@ansible-flow/*) are installed from npm (ADR-0002). The job runs while
# the repository variable AFD_PACKAGES_ON_NPM is "true": set it to "false" for a time when
# package.json names tarballs in vendor/ (an unreleased designer), which is not in git.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: vars.AFD_PACKAGES_ON_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database layer is tested on both databases the server supports (ADR-0005).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: afs
          POSTGRES_PASSWORD: afs-ci-only
          POSTGRES_DB: afs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afs -d afs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Type check
        run: npx --no-install tsc -p tsconfig.json && npx --no-install tsc -p tsconfig.web.json

      - name: Lint and format
        run: npx --no-install biome ci .

      - name: Unit tests
        env:
          AFS_TEST_POSTGRES_URL: postgres://afs:afs-ci-only@127.0.0.1:5432/afs_test
        run: npx --no-install vitest run

      - name: Build
        run: node scripts/build.mjs

  # AFS-138: the pages at 390, 768, 1024 and 1440 px in both themes (test/layout, `just layout`).
  # The check starts the built server itself on SQLite with no container engine: no secrets, no
  # lab, no Docker.
  layout:
    if: vars.AFD_PACKAGES_ON_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Build
        run: node scripts/build.mjs

      - name: Layout check
        run: npx --no-install playwright test -c test/layout/playwright.config.ts

      - name: What it saw, when it failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-results
          path: .layout-results/
          retention-days: 7

  # AFS-98: the Ansible collection (collection/): ansible-test sanity and unit tests.
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collection/ansible_collections/chistokhinsv/ansible_flow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Ansible
        run: pip install --quiet "ansible-core==2.22.*" pytest

      - name: Sanity
        run: ansible-test sanity --python 3.13 --requirements

      - name: Unit tests
        run: ansible-test units --python 3.13 --requirements
