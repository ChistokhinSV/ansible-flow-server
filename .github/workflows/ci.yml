# Checks every push to main and every pull request: the type check, Biome and the unit tests, as
# `just check` and `just test` run them.
#
# The designer's packages (@ansible-flow/*) are installed from npm (ADR-0002). The job runs while
# the repository variable AFD_PACKAGES_ON_NPM is "true": set it to "false" for a time when
# package.json names tarballs in vendor/ (an unreleased designer), which is not in git.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: vars.AFD_PACKAGES_ON_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database layer is tested on both databases the server supports (ADR-0005).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: afs
          POSTGRES_PASSWORD: afs-ci-only
          POSTGRES_DB: afs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afs -d afs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-fund --no-audit

      - name: Type check
        run: npx --no-install tsc -p tsconfig.json && npx --no-install tsc -p tsconfig.web.json

      - name: Lint and format
        run: npx --no-install biome ci .

      - name: Unit tests
        env:
          AFS_TEST_POSTGRES_URL: postgres://afs:afs-ci-only@127.0.0.1:5432/afs_test
        run: npx --no-install vitest run

      - name: Build
        run: node scripts/build.mjs
